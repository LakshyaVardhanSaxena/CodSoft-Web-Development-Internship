<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LvCalc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">LvCalc</h1>
        <div class="calculator">
            <!-- Display Screen -->
            <div class="display">
                <div class="previous-operand" id="previous"></div>
                <div class="current-operand" id="current">0</div>
            </div>

            <!-- Buttons Grid -->
            <div class="buttons">
                <button class="btn span-2 clear" data-action="clear">AC</button>
                <button class="btn delete" data-action="delete">DEL</button>
                <button class="btn operator" data-operator="/">/</button>
                
                <button class="btn number">7</button>
                <button class="btn number">8</button>
                <button class="btn number">9</button>
                <button class="btn operator" data-operator="*">×</button>
                
                <button class="btn number">4</button>
                <button class="btn number">5</button>
                <button class="btn number">6</button>
                <button class="btn operator" data-operator="-">−</button>
                
                <button class="btn number">1</button>
                <button class="btn number">2</button>
                <button class="btn number">3</button>
                <button class="btn operator" data-operator="+">+</button>
                
                <button class="btn number span-2">0</button>
                <button class="btn decimal">.</button>
                <button class="btn equals" data-action="calculate">=</button>
            </div>
        </div>
        <p class="footer">Made for CODSOFT Internship by Lakshya</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
